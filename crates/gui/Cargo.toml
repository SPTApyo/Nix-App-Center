[package]
name = "nix-software-gui"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "nix-software"
path = "src/main.rs"

[features]
# Dev gallery: an extra tab showing every kind of app. Off by default, so
# absent from release builds.
dev-gallery = []

[dependencies]
nix-software-core = { path = "../core" }
relm4 = { version = "0.9", features = ["libadwaita"] }
# Same gtk4 and libadwaita versions as relm4 0.9 pulls, so the gtk:: and
# adw:: paths its macros generate resolve.
gtk = { version = "0.9", package = "gtk4" }
adw = { version = "0.7", package = "libadwaita", features = ["v1_6"] }
# Worker to main thread channel (dry builds in nix_editor), the replacement
# for the removed glib::MainContext::channel.
async-channel = "2"
# i18n: gettext driven by the system locale, like GNOME Software.
gettext-rs = "0.8"
