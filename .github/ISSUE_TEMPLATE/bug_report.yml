name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Search "vlc"
        2. Click Add to Configuration
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nix Software version
      description: About dialog, or the flake revision you run.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Output of nix-software-cli layout --verify, and nixos-version.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run nix-software from a terminal and paste what it prints.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
