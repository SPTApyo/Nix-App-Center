name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a new push cancels the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: test, clippy, translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Tests
        run: nix develop -c cargo test --workspace

      - name: Clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings

      - name: Translations up to date
        run: |
          nix develop -c ./po/update-pot.sh
          git diff --ignore-matching-lines='POT-Creation-Date' --exit-code po/
          for po in po/*.po; do nix develop -c msgfmt --check -o /dev/null "$po"; done

      - name: Format
        run: nix develop -c cargo fmt --all -- --check

  package:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix build .#nix-software -L
