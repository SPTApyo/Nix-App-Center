name: Update flake.lock

# Dependabot does not know Nix: move nixpkgs forward once a week in a PR.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/update-flake-lock@main
        with:
          commit-msg: "build(nix): update flake.lock"
          pr-title: "build(nix): update flake.lock"
